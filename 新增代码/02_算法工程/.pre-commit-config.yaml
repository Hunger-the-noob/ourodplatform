minimum_pre_commit_version: '3.4.0'
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint and import order
        entry: python -m ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: python -m ruff format
        language: system
        types_or: [python, pyi]
