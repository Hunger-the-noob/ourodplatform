name: Data engineering checks
on:
  push:
    branches: [data_new_function]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - name: Check changed Python files
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_REF" ] || ! git cat-file -e "$BASE_REF^{commit}"; then
            BASE_REF=$(git rev-list --max-parents=0 HEAD)
          fi
          python -m pre_commit run --from-ref "$BASE_REF" --to-ref HEAD
      # 推理套件依赖 torch/ultralytics；本任务的轻量环境覆盖其余核心测试。
      - run: python -m pytest --ignore=apps/platform/tests/test_inference_config.py
      - run: python apps/web-backend/manage.py test defect --noinput
